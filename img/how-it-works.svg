<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" role="img" aria-label="One speculative decoding step: the draft guesses the capital of Germany, the target checks the guesses in one pass, keeps the capital of and supplies France" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace">
<text x="20" y="58" font-size="15" font-weight="650" fill="#1f2328">1. The draft model guesses</text>
<text x="20" y="80" font-size="13" fill="#5f6670">K tokens ahead (here K = 4)</text>
<g opacity="1"><rect x="300" y="40" width="100" height="44" rx="8" fill="#f1f1ef" stroke="#e0e0dc" stroke-width="1.5"/><text x="350.0" y="67.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2328">…context</text></g>
<text x="20" y="168" font-size="15" font-weight="650" fill="#1f2328">2. The target model checks</text>
<text x="20" y="190" font-size="13" fill="#5f6670">all K guesses in one forward pass</text>
<g opacity="1"><rect x="300" y="150" width="100" height="44" rx="8" fill="#f1f1ef" stroke="#e0e0dc" stroke-width="1.5"/><text x="350.0" y="177.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2328">…context</text></g>
<text x="20" y="278" font-size="15" font-weight="650" fill="#1f2328">3. Keep the correct guesses</text>
<text x="20" y="300" font-size="13" fill="#5f6670">plus one token from the target</text>
<g opacity="1"><rect x="300" y="260" width="100" height="44" rx="8" fill="#f1f1ef" stroke="#e0e0dc" stroke-width="1.5"/><text x="350.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2328">…context</text></g>
<g opacity="1"><rect x="410" y="40" width="80" height="44" rx="8" fill="#efeafd" stroke="#6741d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="450.0" y="67.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2328">the</text></g>
<g opacity="1"><rect x="498" y="40" width="80" height="44" rx="8" fill="#efeafd" stroke="#6741d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="538.0" y="67.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2328">capital</text></g>
<g opacity="1"><rect x="586" y="40" width="80" height="44" rx="8" fill="#efeafd" stroke="#6741d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="626.0" y="67.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2328">of</text></g>
<g opacity="1"><rect x="674" y="40" width="80" height="44" rx="8" fill="#efeafd" stroke="#6741d9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="714.0" y="67.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2328">Germany</text></g>
<g opacity="1"><rect x="410" y="150" width="80" height="44" rx="8" fill="#e7f5ec" stroke="#2e9e5b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="450.0" y="177.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2328">the</text></g>
<circle cx="484" cy="152" r="10" fill="#2e9e5b"/><path d="M479 152 l3.5 3.8 l6.5 -7.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<g opacity="1"><rect x="498" y="150" width="80" height="44" rx="8" fill="#e7f5ec" stroke="#2e9e5b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="538.0" y="177.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2328">capital</text></g>
<circle cx="572" cy="152" r="10" fill="#2e9e5b"/><path d="M567 152 l3.5 3.8 l6.5 -7.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<g opacity="1"><rect x="586" y="150" width="80" height="44" rx="8" fill="#e7f5ec" stroke="#2e9e5b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="626.0" y="177.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2328">of</text></g>
<circle cx="660" cy="152" r="10" fill="#2e9e5b"/><path d="M655 152 l3.5 3.8 l6.5 -7.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<g opacity="1"><rect x="674" y="150" width="80" height="44" rx="8" fill="#fbeaea" stroke="#d64545" stroke-width="1.5" stroke-dasharray="5 4"/><text x="714.0" y="177.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2328">Germany</text></g>
<circle cx="748" cy="152" r="10" fill="#d64545"/><path d="M743.8 147.8 l8.4 8.4 M752.2 147.8 l-8.4 8.4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
<text x="766" y="170" font-size="14" fill="#5f6670">target would say</text>
<text x="766" y="190" font-size="14" fill="#5f6670">“France”, not “Germany”</text>
<g opacity="1"><rect x="410" y="260" width="80" height="44" rx="8" fill="#e7f5ec" stroke="#2e9e5b" stroke-width="1.5"/><text x="450.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2328">the</text></g>
<g opacity="1"><rect x="498" y="260" width="80" height="44" rx="8" fill="#e7f5ec" stroke="#2e9e5b" stroke-width="1.5"/><text x="538.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2328">capital</text></g>
<g opacity="1"><rect x="586" y="260" width="80" height="44" rx="8" fill="#e7f5ec" stroke="#2e9e5b" stroke-width="1.5"/><text x="626.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#1f2328">of</text></g>
<g opacity="1"><rect x="674" y="260" width="80" height="44" rx="8" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.5"/><text x="714.0" y="287.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">France</text></g>
<text x="766" y="280" font-size="15" font-weight="650" fill="#6741d9">4 tokens from 1 target pass</text>
<text x="766" y="300" font-size="14" fill="#5f6670">acceptance length τ = 1 + 3 = 4</text>
<line x1="20" y1="122" x2="1040" y2="122" stroke="#ececea"/>
<line x1="20" y1="232" x2="1040" y2="232" stroke="#ececea"/>
</svg>
