<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" role="img" aria-label="Score weights: acceptance length 50 percent, draft memory 25 percent, time per output token 25 percent" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace">
<rect x="20" y="20" width="427" height="46" rx="10" fill="#6741d9"/>
<text x="233.5" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">50%</text>
<text x="24" y="96" font-size="16" font-weight="650" fill="#1f2328">Acceptance length τ</text>
<text x="24" y="118" font-size="13" fill="#5f6670">tokens per target pass</text>
<text x="24" y="136" font-size="13" fill="#5f6670">higher is better</text>
<rect x="450" y="20" width="212" height="46" rx="10" fill="#9a7fe6"/>
<text x="556.0" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">25%</text>
<text x="454" y="96" font-size="16" font-weight="650" fill="#1f2328">Draft memory</text>
<text x="454" y="118" font-size="13" fill="#5f6670">weights + KV cache at 16K</text>
<text x="454" y="136" font-size="13" fill="#5f6670">lower is better</text>
<rect x="665" y="20" width="212" height="46" rx="10" fill="#d3c6f5"/>
<text x="771.0" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">25%</text>
<text x="669" y="96" font-size="16" font-weight="650" fill="#1f2328">Time per output token</text>
<text x="669" y="118" font-size="13" fill="#5f6670">decoding speed</text>
<text x="669" y="136" font-size="13" fill="#5f6670">lower is better</text>
</svg>
